name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://market:market@localhost:5432/market
  AUTH_PROVIDER: dev
  ALLOW_DEV_AUTH: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  MEILISEARCH_HOST: http://localhost:7700
  MEILISEARCH_ADMIN_KEY: ci-meilisearch-master-key-0123456789

jobs:
  checks:
    name: Lint, types, tests, build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real Meilisearch, so the end-to-end typo search exercises the production search path.
      meilisearch:
        image: getmeili/meilisearch:v1.30
        env:
          MEILI_MASTER_KEY: ci-meilisearch-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Check the schema matches the migrations
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed demo data
        run: pnpm db:seed

      - name: Build the search index
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:7700/health && break; sleep 2; done
          pnpm search:reindex

      # Production uses Clerk, which renders different components than the dev sign-in used by
      # the e2e tests, so prerender the app in Clerk mode too. Placeholder keys are enough to build.
      - name: Build with Clerk enabled
        run: pnpm build
        env:
          AUTH_PROVIDER: clerk
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZS10ZXN0LmNsZXJrLmFjY291bnRzLmRldiQ=
          CLERK_SECRET_KEY: sk_test_placeholder_for_ci_build_only

      - name: Build for e2e tests (dev sign-in)
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (phone and desktop)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      # No dependency install in this job, so no pnpm cache (an empty cache path fails the job).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
